services:
  db:
    image: "postgres:16-alpine"
    container_name: pharmatrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmatrack
      POSTGRES_PASSWORD: pharmatrack
      POSTGRES_DB: pharmatrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmatrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    container_name: pharmatrack-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://pharmatrack:pharmatrack@db:5432/pharmatrack?schema=public"
      JWT_SECRET: "R6KklYUTaMAceAzl0SoAYHxN68UQjAsSsnOsl7SaJnY"
      PORT: "4000"
    ports:
      - "4000:4000"
      - "5555:5555"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npm run dev"

volumes:
  pgdata: